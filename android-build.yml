name: Build ReL Photo Dokumentasi APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReL-Photo-Dokumentasi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ReL-Photo-Dokumentasi.apk
      - name: Upload named APK
        uses: actions/upload-artifact@v4
        with:
          name: ReL-Photo-Dokumentasi-APK
          path: app/build/outputs/apk/debug/ReL-Photo-Dokumentasi.apk
